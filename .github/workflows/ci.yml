name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    name: Auth Service CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: gatekeeper_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/auth/go.mod
          cache-dependency-path: services/auth/go.sum

      - name: Verify Swagger specification generation
        working-directory: services/auth
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g cmd/api/main.go -d ./ --parseInternal -o ./api
          git diff --exit-code api/

      - name: Apply database migrations
        working-directory: services/auth
        env:
          DATABASE_URL: postgres://gatekeeper:secretpassword@localhost:5432/gatekeeper_auth?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Run tests with race detector
        working-directory: services/auth
        env:
          INTEGRATION_TEST: "true"
          TEST_DATABASE_URL: postgres://gatekeeper:secretpassword@localhost:5432/gatekeeper_auth?sslmode=disable
        run: go test -v -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: services/auth

      - name: Build Docker image
        run: docker build -t gatekeeper-auth:ci services/auth

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (Trivy v0.70.0)
        with:
          image-ref: 'gatekeeper-auth:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

  publish-ghcr:
    name: Publish Auth Image to GHCR
    needs: auth
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push only the immutable commit tag first. `latest` moves only after the
      # exact published manifest passes the Trivy gate for every platform.
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/auth
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/qosmuratsamat0/gatekeeper-auth:sha-${{ github.sha }}

      - name: Scan published image (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (Trivy v0.70.0)
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ghcr.io/qosmuratsamat0/gatekeeper-auth@${{ steps.build.outputs.digest }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Scan published image (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (Trivy v0.70.0)
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ghcr.io/qosmuratsamat0/gatekeeper-auth@${{ steps.build.outputs.digest }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Promote scanned digest to latest
        env:
          IMAGE_LATEST: ghcr.io/qosmuratsamat0/gatekeeper-auth:latest
          IMAGE_DIGEST_REF: ghcr.io/qosmuratsamat0/gatekeeper-auth@${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "${IMAGE_LATEST}" "${IMAGE_DIGEST_REF}"

      - name: Verify image pull and multi-arch manifest
        env:
          IMAGE_NAME: ghcr.io/qosmuratsamat0/gatekeeper-auth
          IMAGE_TAG: ghcr.io/qosmuratsamat0/gatekeeper-auth:sha-${{ github.sha }}
          IMAGE_LATEST: ghcr.io/qosmuratsamat0/gatekeeper-auth:latest
          IMAGE_DIGEST_REF: ghcr.io/qosmuratsamat0/gatekeeper-auth@${{ steps.build.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pulling published image by commit tag: ${IMAGE_TAG}"
          docker pull "${IMAGE_TAG}"
          echo "Pulling published image by digest reference: ${IMAGE_DIGEST_REF}"
          docker pull "${IMAGE_DIGEST_REF}"
          for REF in "${IMAGE_TAG}" "${IMAGE_DIGEST_REF}"; do
            echo "Inspecting manifest for supported platforms: ${REF}"
            MANIFEST=$(docker buildx imagetools inspect "${REF}")
            echo "${MANIFEST}"
            echo "${MANIFEST}" | grep -q "linux/amd64" || { echo "Missing linux/amd64 in ${REF}"; exit 1; }
            echo "${MANIFEST}" | grep -q "linux/arm64" || { echo "Missing linux/arm64 in ${REF}"; exit 1; }
          done
          LATEST_DIGEST=$(docker buildx imagetools inspect "${IMAGE_LATEST}" | awk '/^Digest:/ {print $2; exit}')
          if [ "${LATEST_DIGEST}" != "${DIGEST}" ]; then
            echo "latest points to ${LATEST_DIGEST}, expected scanned digest ${DIGEST}"
            exit 1
          fi
          echo "Manifest multi-architecture verification passed; latest matches the scanned digest."
          {
            echo "### Published Auth Container Image"
            echo "- **Image Name:** \`${IMAGE_NAME}\`"
            echo "- **Commit Tag:** \`${IMAGE_TAG}\`"
            echo "- **Latest Tag:** \`${IMAGE_LATEST}\` (promoted after Trivy scan of amd64 and arm64)"
            echo "- **Digest Reference:** \`${IMAGE_DIGEST_REF}\`"
            echo "- **Digest:** \`${DIGEST}\`"
            echo "- **Attestations:** SLSA provenance and SBOM attached by Buildx"
          } >> "$GITHUB_STEP_SUMMARY"
