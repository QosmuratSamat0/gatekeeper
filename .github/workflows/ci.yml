name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  auth:
    name: Auth Service CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: gatekeeper_auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/auth/go.mod
          cache-dependency-path: services/auth/go.sum

      - name: Verify Swagger specification generation
        working-directory: services/auth
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.4 init -g cmd/api/main.go -d ./ --parseInternal -o ./api
          git diff --exit-code api/

      - name: Apply database migrations
        working-directory: services/auth
        env:
          DATABASE_URL: postgres://gatekeeper:secretpassword@localhost:5432/gatekeeper_auth?sslmode=disable
        run: go run ./cmd/migrate up

      - name: Run tests with race detector
        working-directory: services/auth
        env:
          INTEGRATION_TEST: "true"
          TEST_DATABASE_URL: postgres://gatekeeper:secretpassword@localhost:5432/gatekeeper_auth?sslmode=disable
        run: go test -v -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          working-directory: services/auth

      - name: Build Docker image
        run: docker build -t gatekeeper-auth:ci services/auth

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gatekeeper-auth:ci'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
